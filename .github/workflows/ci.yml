# Comprobación rápida en cada empujón: que compila y que los tipos cuadran.
# El empaquetado no se hace aquí; eso vive en release.yml y sólo con etiqueta.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lee el repositorio: si un paso se viera comprometido, el token no
# le deja escribir nada.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.node.json
      - run: pnpm exec tsc --noEmit -p tsconfig.web.json
      - run: node scripts/check-native.cjs
      - run: pnpm build
