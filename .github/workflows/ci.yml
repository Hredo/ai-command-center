# Comprobación rápida en cada empujón: que compila y que los tipos cuadran.
# El empaquetado no se hace aquí; eso vive en release.yml y sólo con etiqueta.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lee el repositorio: si un paso se viera comprometido, el token no
# le deja escribir nada.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.node.json
      - run: pnpm exec tsc --noEmit -p tsconfig.web.json
      - run: node scripts/check-native.cjs
      - run: pnpm build
