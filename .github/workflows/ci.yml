# Comprobación rápida en cada empujón: que compila y que los tipos cuadran.
# El empaquetado no se hace aquí; eso vive en release.yml y sólo con etiqueta.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.node.json
      - run: pnpm exec tsc --noEmit -p tsconfig.web.json
      - run: node scripts/check-native.cjs
      - run: pnpm build
