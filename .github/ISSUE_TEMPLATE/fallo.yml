name: Informar de un fallo
description: Algo no funciona o no arranca
labels: [fallo]
body:
  - type: markdown
    attributes:
      value: |
        Antes de nada, los avisos del sistema al abrirla por primera vez no son un
        fallo: la app no está firmada y el README explica qué hacer en cada caso.
        - Windows sin la opción «Ejecutar de todas formas»: es Smart App Control.
          Prueba el `.zip` portátil.
        - macOS dice que no se puede abrir: Ajustes del Sistema → Privacidad y
          seguridad → «Abrir igualmente».
  - type: input
    id: version
    attributes:
      label: Versión de la aplicación
      description: Sale en Ajustes, abajo del todo.
      placeholder: "0.4.0"
    validations: { required: true }
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      options: [Windows, macOS con chip de Apple, macOS con Intel, Linux]
    validations: { required: true }
  - type: dropdown
    id: origen
    attributes:
      label: Cómo la instalaste
      options:
        - Instalador .exe (Windows)
        - Zip portátil (Windows)
        - .dmg (macOS)
        - .deb (Linux)
        - AppImage (Linux)
        - Compilada desde el código
    validations: { required: true }
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué esperabas y qué ocurrió en su lugar.
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Abrir la pantalla de...
        2. Pulsar en...
        3. Sale...
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Versión del sistema (y en Linux, la distribución), y si tienes git, gh u Ollama instalados.
